<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display CSS Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .div1 {
           border: 2px red solid;
           display: inline;
        }
        .div2 {
            border: 2px rgb(0, 255, 47) solid;
            display: inline;
        }
        a {
            display: inline-block; 
            width: 150px;
            padding: 20px;
            border: solid 2px green;
        }
        span {
            display: inline-block;
            width: 200px;
            border: solid 2px green;
        }
        .common {
            border: 1px solid red;
            display: inline;
            width: 50px;
        }
        .parent-div {
            width: 200px;
            display: flex;
            align-items: center;
           justify-content: right;
           flex-wrap: wrap;
           border: solid 2px green;
        }
        h1 {
            display: none;
        }
    </style>
</head>
<body>
    <section>
    <div class="div1">Div 1</div>
    <div class="div2">Div 2</div>
    <a href="#">Home</a>
    <span>some text here in span element</span>
</section>
<br>
<h1>Display Flex Example</h1>
<section>
    <div class="parent-div">
    <div class="div3 common">Div 3</div>
    <div class="div4 common">Div 4</div>
    <div class="div5 common">Div 5</div>
    <div class="div6 common">Div 6</div>
    </div>
</section>

</body>
</html>
