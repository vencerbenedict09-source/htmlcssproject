<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        div {
            border: solid green 3px;
        }
        .box {
            padding-left: 30px;
            width: 100px;
            height: 100px;
            background-color: lightblue;
            border-left: 2px solid #61d811;
            border-right: 2px solid #012bff;
            border-top: 2px dotted #ff0000;
            border-radius: 10px 20px; 
            margin: 10px 8px 12px 15px;
        }
        .container {
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box 1
        </div>
    </div>
</body>
</html>
