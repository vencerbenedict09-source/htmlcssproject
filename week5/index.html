<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
<!-- Internal CSS -->
    <style> 
        div {
            background-color: black;
            color: white;
        }
        p {
            color: blue;
        }
        #box {
            color: white;
            width: 200px;
            height: 200px;
            border: solid blue 4px;
        }
        #box2 {
            width: 100px;
            height: 100px;
            border: 1px red solid;
        }
        .box {
            margin-left: 30px;
        }
        .box3 {
            width: 300px;
            height: 300px;
            border: solid 2px red;
            margin-left: 60px;
        }
        #box3 p {
            color: yellow;
        }
    </style>
    

</head>
<body style="background-color: gray;">
    <!-- Inline CSS -->
    <h1 style="color: red; background-color: aqua">Welcome to My Website</h1>
    <h2 style="color: green; border: solid 2px red;">Intro to CSS</h2>
    <div id="box" class="box">
        <h1>Box 1</h1>
    </div>
    <div id="box2" class="box">
        <h2>Box 2</h2>
    </div>
    <div id="box3" class="box3">
        <h2>Box 3</h2>
        <p>This is a paragraph inside Box 3.</p>
        <p>This is another paragraph inside Box 3.</p>
        <h2>Box 4</h2>
        <p>This is a paragraph inside Box 4.</p>
        <p>This is another paragraph inside Box 4.</p>
    </div>

    <!--Way to write CSS
        Internal CSS: style="property: value;"
        Inline CSS: <style> property: value; </style>
        External CSS: <link rel="stylesheet" href="style.css">-->

</body>
</html>
